<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f1c" />
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('pulso.theme') || 'dark'; } catch (e) { /* oscuro */ }</script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Pulso</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/css/app.css" />
  <script src="/vendor/chart.umd.min.js"></script>
  <script src="/vendor/chartjs-adapter-date-fns.bundle.min.js"></script>
</head>
<body>
  <div id="app"><div style="padding:40px;color:#8e9aa5;font-family:system-ui">Cargando Pulso…</div></div>
  <script type="module">
    // Tras una actualización, Safari/Bluefy puede tener módulos viejos en caché y mezclarlos con los
    // nuevos (pantalla en blanco). Si la versión cambió, se vuelven a descargar todos antes de arrancar.
    try {
      const b = await (await fetch('/build.json', { cache: 'no-store' })).json();
      let seen = null;
      try { seen = localStorage.getItem('pulso.build'); } catch { /* private mode */ }
      if (seen !== b.build) {
        await Promise.all(b.files.map((f) => fetch(f, { cache: 'reload' }).catch(() => null)));
        const css = document.querySelector('link[rel=stylesheet][href^="/css/app.css"]');
        if (css) css.href = `/css/app.css?v=${b.build}`;
        try { localStorage.setItem('pulso.build', b.build); } catch { /* ignore */ }
      }
    } catch { /* sin conexión: arrancar con lo que haya */ }
    await import('/js/main.js');
  </script>
</body>
</html>

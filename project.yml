name: Pulso
options:
  bundleIdPrefix: com.pulso
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: es
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # ⚠️ Pon aquí tu Team ID (o elígelo en Xcode › Signing & Capabilities)
    DEVELOPMENT_TEAM: ""
packages:
  WhoopKit:
    path: Packages/WhoopKit
targets:
  Pulso:
    type: application
    platform: iOS
    sources:
      - path: Pulso
    dependencies:
      - package: WhoopKit
    entitlements:
      path: Pulso/Resources/Pulso.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Pulso/Resources/Info.plist
      properties:
        CFBundleDisplayName: Pulso
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSBluetoothAlwaysUsageDescription: "Pulso se conecta por Bluetooth a tu pulsera WHOOP 4.0 para descargar tus datos de frecuencia cardiaca, sueño y actividad."
        NSHealthShareUsageDescription: "Pulso lee pasos, peso y entrenamientos (por ejemplo de Strong) para completar tu análisis diario."
        NSHealthUpdateUsageDescription: "Pulso guarda en Salud tu frecuencia cardiaca, frecuencia en reposo, respiración y fases de sueño."
        UIBackgroundModes: [bluetooth-central, fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.pulso.app.refresh, com.pulso.app.processing]
        CFBundleURLTypes:
          - CFBundleURLName: com.pulso.app
            CFBundleURLSchemes: [pulso]
        CFBundleDocumentTypes:
          - CFBundleTypeName: CSV de Strong
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.comma-separated-values-text, public.plain-text]
        LSSupportsOpeningDocumentsInPlace: false
        UIFileSharingEnabled: true
    settings:
      base:
        # ⚠️ Cámbialo por uno único, p. ej. com.tunombre.pulso (las cuentas gratuitas lo exigen)
        PRODUCT_BUNDLE_IDENTIFIER: com.cambiame.pulso
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pulso
schemes:
  Pulso:
    build:
      targets:
        Pulso: all
    run:
      config: Debug
    archive:
      config: Release
